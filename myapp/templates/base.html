<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ascend{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% block navbar %}
  <nav class="navbar navbar-expand-lg" style="background-color: #26215c;">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="{{ url_for('dashboard') }}" style="font-family: Fraunces, serif; font-weight: 600;">Ascend</a>
      {% if current_user.is_authenticated %}
        <div class="d-flex">
          <a class="nav-link text-white" href="{{ url_for('logout') }}">Logout</a>
        </div>
      {% endif %}
    </div>
  </nav>
  {% endblock %}

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
