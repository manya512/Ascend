{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Issue Certificate: {{ certificate.title }}</h2>
            <div class="card shadow-sm" style="border-top: 4px solid #26215c;">
                <div class="card-body">
                    <form action="{{ url_for('issue_certificate', cert_id=certificate.id) }}" method="POST">
                        <div class="mb-4">
                            <label for="recipient_email" class="form-label">Recipient Email</label>
                            <input type="email" class="form-control" id="recipient_email" name="recipient_email" required placeholder="member@example.com">
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('certificates_list') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Issue Certificate</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
