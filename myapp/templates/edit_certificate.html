{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex gap-4">
        <div class="w-100">
            <h2>Edit Certificate</h2>
            <form action="{{ url_for('edit_certificate', cert_id=certificate.id) }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">Certificate Title</label>
                    <input type="text" class="form-control" id="title" name="title" required oninput="updatePreview()" value="{{ certificate.title }}">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5">{{ certificate.description }}</textarea>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
        
        <div class="w-100">
            <h2>Preview</h2>
            <div id="certificate-preview" style="
                border: 8px solid #26215c;
                padding: 40px;
                text-align: center;
                background-color: #fcfcfc;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                min-height: 400px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            ">
                <h1 id="preview-title" style="
                    color: #ef9f27;
                    font-family: Georgia, serif;
                    font-size: 2.5rem;
                    margin-bottom: 20px;
                ">{{ certificate.title or 'Certificate Title' }}</h1>
                
                <p style="
                    color: #26215c;
                    font-size: 1.2rem;
                ">This certificate is proudly presented.</p>
            </div>
        </div>
    </div>
</div>

<script>
function updatePreview() {
    var titleInput = document.getElementById('title').value;
    var previewTitle = document.getElementById('preview-title');
    
    if (titleInput.trim() === '') {
        previewTitle.innerText = 'Certificate Title';
    } else {
        previewTitle.innerText = titleInput;
    }
}
</script>
{% endblock %}
